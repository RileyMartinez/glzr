general:
  # Commands to run when GlazeWM starts (Development Profile).
  startup_commands:
    [
      'shell-exec pwsh -WindowStyle Hidden -Command "if (-not (Get-Process -Name ''zebar'' -ErrorAction SilentlyContinue)) { Start-Process ''zebar'' }"',
      'shell-exec pwsh -Command "if (-not (Get-Process -Name ''chrome'' -ErrorAction SilentlyContinue)) { Start-Process ''explorer.exe'' ''\"C:\Program Files\Google\Chrome\Application\chrome.exe\"'' }"',
      'shell-exec pwsh -Command "if (-not (Get-Process -Name ''Antigravity'' -ErrorAction SilentlyContinue)) { Start-Process ''explorer.exe'' ''\"C:\Users\riley\AppData\Local\Programs\Antigravity\Antigravity.exe\"'' }"',
      'shell-exec pwsh -Command "if (-not (Get-Process -Name ''Antigravity IDE'' -ErrorAction SilentlyContinue)) { Start-Process ''explorer.exe'' ''\"C:\Users\riley\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe\"'' }"',
      'shell-exec pwsh -Command "if (-not (Get-Process -Name ''Docker Desktop'' -ErrorAction SilentlyContinue)) { Start-Process ''explorer.exe'' ''\"C:\Program Files\Docker\Docker\Docker Desktop.exe\"'' }"',
      'shell-exec pwsh -Command "if (-not (Get-Process -Name ''1Password'' -ErrorAction SilentlyContinue)) { Start-Process ''explorer.exe'' ''shell:AppsFolder\Agilebits.1Password_amwd9z03whsfe!Agilebits.OnePassword'' }"',
      'shell-exec pwsh -Command "if (-not (Get-Process -Name ''Obsidian'' -ErrorAction SilentlyContinue)) { Start-Process ''explorer.exe'' ''\"C:\Program Files\Obsidian\Obsidian.exe\"'' }"',
      'shell-exec pwsh -Command "if (-not (Get-Process -Name ''WindowsTerminal'' -ErrorAction SilentlyContinue)) { Start-Process ''wt'' }"',
      'shell-exec pwsh -Command "if (-not (Get-Process -Name ''Discord'' -ErrorAction SilentlyContinue)) { Start-Process ''explorer.exe'' ''\"C:\Users\riley\AppData\Local\Discord\Discord.exe\"'' }"'
    ]

  shutdown_commands: ["shell-exec taskkill /IM zebar.exe /F"]
  config_reload_commands: []

  focus_follows_cursor: false
  toggle_workspace_on_refocus: false

  cursor_jump:
    enabled: true
    trigger: "monitor_focus"

  hide_method: "cloak"
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: "0px"
  outer_gap:
    top: "40px"
    right: "0px"
    bottom: "0px"
    left: "0px"

window_effects:
  focused_window:
    border:
      enabled: true
      color: "#8dbcff"
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: "square"
    transparency:
      enabled: false
      opacity: "95%"

  other_windows:
    border:
      enabled: true
      color: "#a1a1a1"
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: "square"
    transparency:
      enabled: false
      opacity: "0%"

window_behavior:
  initial_state: "tiling"
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

# Single monitor setup: Workspaces 1 through 9
workspaces:
  - name: "1"
    keep_alive: true
  - name: "2"
    keep_alive: true
  - name: "3"
    keep_alive: true
  - name: "4"
    keep_alive: true
  - name: "5"
    keep_alive: true
  - name: "6"
    keep_alive: true
  - name: "7"
    keep_alive: true
  - name: "8"
    keep_alive: true
  - name: "9"
    keep_alive: true

window_rules:
  - commands: ["move --workspace 1"]
    match:
      - window_process: { equals: "chrome" }

  - commands: ["move --workspace 2"]
    match:
      - window_process: { equals: "Antigravity" }

  - commands: ["move --workspace 3"]
    match:
      - window_process: { equals: "Antigravity IDE" }

  - commands: ["move --workspace 4"]
    match:
      - window_process: { equals: "Docker Desktop" }

  - commands: ["move --workspace 5"]
    match:
      - window_process: { equals: "1Password" }

  - commands: ["move --workspace 7"]
    match:
      - window_process: { equals: "Obsidian" }

  - commands: ["move --workspace 8"]
    match:
      - window_process: { equals: "WindowsTerminal" }

  - commands: ["set-tiling", "move --workspace 9"]
    match:
      - window_process: { equals: "Discord" }

  - commands: ["ignore"]
    match:
      - window_process: { equals: "zebar" }
      - window_title: { regex: "[Pp]icture.in.[Pp]icture" }
        window_class: { regex: "Chrome_WidgetWin_1|MozillaDialogClass" }
      - window_process: { equals: "PowerToys" }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_process: { equals: "PowerToys" }
        window_title: { regex: ".*? - Peek" }
      - window_process: { equals: "Lively" }
        window_class: { regex: "HwndWrapper" }

binding_modes:
  - name: "resize"
    keybindings:
      - commands: ["resize --width -2%"]
        bindings: ["h", "left"]
      - commands: ["resize --width +2%"]
        bindings: ["l", "right"]
      - commands: ["resize --height +2%"]
        bindings: ["k", "up"]
      - commands: ["resize --height -2%"]
        bindings: ["j", "down"]
      - commands: ["wm-disable-binding-mode --name resize"]
        bindings: ["escape", "enter"]

# Development Profile Keybindings: Alt modifier
# Caps Lock is remapped to Left Ctrl by PowerToys for Vim motions in IDEs & Terminal.
# GlazeWM binds to Alt so Ctrl remains 100% unobstructed for coding.
keybindings:
  # Focus navigation
  - commands: ["focus --direction left"]
    bindings: ["alt+h", "alt+left"]
  - commands: ["focus --direction right"]
    bindings: ["alt+l", "alt+right"]
  - commands: ["focus --direction up"]
    bindings: ["alt+k", "alt+up"]
  - commands: ["focus --direction down"]
    bindings: ["alt+j", "alt+down"]

  # Window movement
  - commands: ["move --direction left"]
    bindings: ["alt+shift+h", "alt+shift+left"]
  - commands: ["move --direction right"]
    bindings: ["alt+shift+l", "alt+shift+right"]
  - commands: ["move --direction up"]
    bindings: ["alt+shift+k", "alt+shift+up"]
  - commands: ["move --direction down"]
    bindings: ["alt+shift+j", "alt+shift+down"]

  # Resizing
  - commands: ["resize --width -2%"]
    bindings: ["alt+u"]
  - commands: ["resize --width +2%"]
    bindings: ["alt+p"]
  - commands: ["resize --height +2%"]
    bindings: ["alt+o"]
  - commands: ["resize --height -2%"]
    bindings: ["alt+i"]
  - commands: ["wm-enable-binding-mode --name resize"]
    bindings: ["alt+r"]

  # Toggle pause
  - commands: ["wm-toggle-pause"]
    bindings: ["alt+shift+p"]

  # Toggle PowerToys Keyboard Manager directly via hotkey
  - commands: ['shell-exec pwsh -WindowStyle Hidden -File "C:\Users\riley\.glzr\glazewm\scripts\toggle-kbm.ps1"']
    bindings: ["alt+shift+k", "alt+ctrl+k", "alt+caps_lock+k"]

  # Window state controls
  - commands: ["toggle-tiling-direction"]
    bindings: ["alt+v"]
  - commands: ["wm-cycle-focus"]
    bindings: ["alt+c"]
  - commands: ["toggle-floating --centered"]
    bindings: ["alt+shift+space"]
  - commands: ["toggle-tiling"]
    bindings: ["alt+t"]
  - commands: ["toggle-fullscreen"]
    bindings: ["alt+f"]
  - commands: ["toggle-minimized"]
    bindings: ["alt+m"]
  - commands: ["close"]
    bindings: ["alt+shift+q"]

  # GlazeWM process controls
  - commands: ["wm-exit"]
    bindings: ["alt+shift+e"]
  - commands: ["wm-reload-config"]
    bindings: ["alt+shift+r"]
  - commands: ["wm-redraw"]
    bindings: ["alt+shift+w"]

  # Launch Terminal
  - commands: ["shell-exec wt"]
    bindings: ["alt+enter"]

  # Toggle between most recent workspaces
  - commands: ["focus --recent-workspace"]
    bindings: ["alt+d"]

  # Workspace focus: Alt + 1..9
  - commands: ["focus --workspace 1"]
    bindings: ["alt+1"]
  - commands: ["focus --workspace 2"]
    bindings: ["alt+2"]
  - commands: ["focus --workspace 3"]
    bindings: ["alt+3"]
  - commands: ["focus --workspace 4"]
    bindings: ["alt+4"]
  - commands: ["focus --workspace 5"]
    bindings: ["alt+5"]
  - commands: ["focus --workspace 6"]
    bindings: ["alt+6"]
  - commands: ["focus --workspace 7"]
    bindings: ["alt+7"]
  - commands: ["focus --workspace 8"]
    bindings: ["alt+8"]
  - commands: ["focus --workspace 9"]
    bindings: ["alt+9"]

  # Move window to workspace: Alt + Shift + 1..9
  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["alt+shift+1"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["alt+shift+2"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["alt+shift+3"]
  - commands: ["move --workspace 4", "focus --workspace 4"]
    bindings: ["alt+shift+4"]
  - commands: ["move --workspace 5", "focus --workspace 5"]
    bindings: ["alt+shift+5"]
  - commands: ["move --workspace 6", "focus --workspace 6"]
    bindings: ["alt+shift+6"]
  - commands: ["move --workspace 7", "focus --workspace 7"]
    bindings: ["alt+shift+7"]
  - commands: ["move --workspace 8", "focus --workspace 8"]
    bindings: ["alt+shift+8"]
  - commands: ["move --workspace 9", "focus --workspace 9"]
    bindings: ["alt+shift+9"]
